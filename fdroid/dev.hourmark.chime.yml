Summary: Hourly chime with quiet hours, and no network access
Description: |-
  Hour Beep plays one short sound at the top of each hour, in the manner of
  a Casio watch.

  You can choose Soft, Beep Beep, Cuckoo, or a recording of a real Casio
  chime. Quiet hours are optional. Both the start and the end of that range
  stay silent. The loudness slider only turns this app down against the
  phone's alarm volume. It does not change the system alarm volume.

  There is no network permission, no account, and no advertising. The source
  is published under GPL-3.0-only.

RepoType: git
Repo: https://github.com/aliHOZA/HourBeep.git

Builds:
  - versionName: '1.4.9'
    versionCode: 6
    commit: 4b00fd72a551d771c06d007ddffa7b72b766535c
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends openjdk-17-jdk-headless python3
    build:
      - |
        set -eu
        SDK="$$SDK$$"
        export ANDROID_SDK_ROOT="$$SDK$$"
        if [ -x "$$SDK$$/cmdline-tools/latest/bin/sdkmanager" ]; then
          "$$SDK$$/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$$SDK$$" "platforms;android-36" "build-tools;34.0.0"
        elif command -v sdkmanager >/dev/null 2>&1; then
          sdkmanager "platforms;android-36" "build-tools;34.0.0"
        else
          "$$SDK$$/tools/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0"
        fi
        if [ ! -x "$$SDK$$/cmdline-tools/latest/bin/r8" ]; then
          mkdir -p "$$SDK$$/cmdline-tools/latest/bin"
          printf '%s\n' '#!/bin/sh' "exec java -cp \"$$SDK$$/build-tools/34.0.0/lib/d8.jar\" com.android.tools.r8.R8 \"\$@\"" > "$$SDK$$/cmdline-tools/latest/bin/r8"
          chmod 755 "$$SDK$$/cmdline-tools/latest/bin/r8"
        fi
        sh build.sh
    output: unsigned.apk

MaintainerNotes: |-
  There is no Gradle project. build.sh calls aapt2, javac and R8, and writes
  unsigned.apk in the repository root. versionCode and versionName live in
  that script. The files in res/raw are the chime sounds, not third-party code.
  Tag v1.4.9 is commit 4b00fd72a551d771c06d007ddffa7b72b766535c.

AutoUpdateMode: Version
