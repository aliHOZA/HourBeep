name: Build Hour Beep

on:
  push:
    branches: [main]
    paths:
      - 'AndroidManifest.xml'
      - 'build.sh'
      - 'proguard-rules.pro'
      - 'res/**'
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android platform and build tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0"

      - name: Install standalone R8 launcher
        run: |
          mkdir -p "$RUNNER_TEMP/r8"
          curl --fail --location --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar \
            --output "$RUNNER_TEMP/r8/r8.jar"
          cat > "$RUNNER_TEMP/r8/r8" <<'EOF'
          #!/bin/sh
          exec java -cp "$RUNNER_TEMP/r8/r8.jar" com.android.tools.r8.R8 "$@"
          EOF
          chmod +x "$RUNNER_TEMP/r8/r8"
          echo "R8=$RUNNER_TEMP/r8/r8" >> "$GITHUB_ENV"

      - name: Build unsigned APK
        run: sh build.sh

      - name: Package source snapshot
        run: git archive --format=zip --output=HourBeep-1.2-source.zip HEAD

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: HourBeep-1.2-build
          path: |
            unsigned.apk
            HourBeep-1.2-source.zip
          if-no-files-found: error
          retention-days: 30
